  windows-numerical:
    name: Tagged Windows numerical regressions
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Sync the tagged locked test environment
        run: uv sync --locked --group test
      - name: Run the tagged numerical regression suite
        run: uv run --no-sync pytest -m slow -v
