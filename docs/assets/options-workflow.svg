<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title description">
  <title id="title">Option valuation and volatility modelling</title>
  <desc id="description">OptionChainAnalytics supplies point-in-time option chains, VanillaOptionPricers supplies BSM and Bachelier pricing, and QIS supplies analytics and reporting. Each package feeds StochVolModels through its own arrow.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; text-anchor: middle; }
    .box { fill: #f0edfc; stroke: #9987c9; stroke-width: 1.4; }
    .name { font-size: 16px; font-weight: 600; }
    .detail { font-size: 13px; }
    .edge { fill: none; stroke: #57606a; stroke-width: 1.6; marker-end: url(#arrow); }
    .arrow { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .box { fill: #28243c; stroke: #a99bd4; }
      .edge { stroke: #b1bac4; }
      .arrow { fill: #b1bac4; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>

  <!-- Preserve the three existing inputs to StochVolModels. -->
  <path class="edge" d="M380 46 C475 46 475 160 570 160"/>
  <path class="edge" d="M380 176 H570"/>
  <path class="edge" d="M380 301 C475 301 475 192 570 192"/>

  <g>
    <rect class="box" x="150" y="15" width="230" height="62" rx="5"/>
    <text class="name" x="265" y="41">option-chain-analytics</text>
    <text class="detail" x="265" y="61">point-in-time option chains</text>
  </g>
  <g>
    <rect class="box" x="150" y="145" width="230" height="62" rx="5"/>
    <text class="name" x="265" y="171">vanilla-option-pricers</text>
    <text class="detail" x="265" y="191">BSM &amp; Bachelier pricing</text>
  </g>
  <g>
    <rect class="box" x="150" y="270" width="230" height="62" rx="5"/>
    <text class="name" x="265" y="296">qis</text>
    <text class="detail" x="265" y="316">analytics &amp; reporting</text>
  </g>
  <g>
    <rect class="box" x="570" y="145" width="230" height="62" rx="5"/>
    <text class="name" x="685" y="171">stochvolmodels</text>
    <text class="detail" x="685" y="191">stochastic volatility models</text>
  </g>
</svg>
