name: Required checks
on:
  pull_request:
    branches: [codex/dependabot-e2e-target-20261102]
permissions:
  contents: read
jobs:
  required:
    name: Required checks
    runs-on: ubuntu-latest
    steps:
      - name: Exercise controlled success and failure branches
        env:
          FIXTURE_REF: ${{ github.head_ref }}
        run: |
          if [[ "$FIXTURE_REF" == "codex/dependabot-e2e-failure-20261102" ]]; then
            echo "Expected failure for isolated notification integration test"
            exit 1
          fi
          echo "Expected success for isolated merge integration test"
