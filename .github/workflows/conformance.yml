# SHARED CI CORE v1.2 — profile — synced 2026-09-08 — template conformance-v1
name: Public conformance
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["scripts/**", ".github/workflows/conformance.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate checker and release tooling contracts
        run: python -m unittest discover -s scripts/tests -v
      - name: Collect public sources and all tags
        if: github.event_name != 'pull_request'
        run: python scripts/clone_public.py --root "$RUNNER_TEMP/public-repos"
      - name: Record timestamped public observations
        if: github.event_name != 'pull_request'
        run: python scripts/conformance.py --repos-root "$RUNNER_TEMP/public-repos" --output report --online
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: conformance-report
          path: report/
          if-no-files-found: error
          retention-days: 30
  record:
    needs: collect
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: conformance-report
          path: report/
      - name: Commit only the conformance report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp report/CONFORMANCE.json CONFORMANCE.json
          cp report/CONFORMANCE.md CONFORMANCE.md
          git add -- CONFORMANCE.json CONFORMANCE.md
          if ! git diff --quiet --cached; then
            git commit -m "chore: refresh public conformance report"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
