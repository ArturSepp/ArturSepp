name: Profile downloads
on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify and collect exact Pepy dashboard totals
        run: python scripts/refresh_downloads.py --output "$RUNNER_TEMP/profile-downloads"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-downloads
          path: ${{ runner.temp }}/profile-downloads/
          if-no-files-found: error
          retention-days: 7
  record:
    needs: collect
    # Share the lock with conformance.yml to preserve both sets of generated files.
    concurrency: public-generated-reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Download generated report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-downloads
          path: ${{ runner.temp }}/profile-downloads
      - name: Back off before retrying the artifact download
        if: steps.download.outcome == 'failure'
        run: sleep 10
      - name: Retry downloading generated report
        id: download_retry
        if: steps.download.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-downloads
          path: ${{ runner.temp }}/profile-downloads
      - name: Back off before the final artifact download attempt
        if: steps.download_retry.outcome == 'failure'
        run: sleep 30
      - name: Final attempt to download generated report
        if: steps.download_retry.outcome == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-downloads
          path: ${{ runner.temp }}/profile-downloads
      - name: Publish verified downloads snapshot with push reconciliation
        run: python scripts/workflow_support.py downloads --source "$RUNNER_TEMP/profile-downloads"
