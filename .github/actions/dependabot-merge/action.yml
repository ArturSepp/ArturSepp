name: Verified OSS Dependabot merge
description: Merge dependency-only Dependabot updates after exact-head required CI, and deduplicate failure notifications.
inputs:
  github-token:
    description: Repository-scoped GitHub Actions token
    required: true
  apply:
    description: Set true to merge eligible PRs and notify failures; false only reports decisions
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'
    - name: Evaluate Dependabot updates from trusted shared code
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APPLY: ${{ inputs.apply }}
      run: |
        args=(--repository "$GITHUB_REPOSITORY" --output-dir "$RUNNER_TEMP/dependabot-merge")
        if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
        python "$GITHUB_ACTION_PATH/../../../scripts/dependabot_merge.py" "${args[@]}"
    - name: Publish the decision summary
      if: always()
      shell: bash
      run: |
        if [[ -f "$RUNNER_TEMP/dependabot-merge/summary.md" ]]; then
          cat "$RUNNER_TEMP/dependabot-merge/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: dependabot-merge-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/dependabot-merge/
        if-no-files-found: warn
        retention-days: 30
